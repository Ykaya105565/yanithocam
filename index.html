<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#eef1f7"/>
<title>FORGE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#eef1f7;color:#1d2430;font-family:'Courier New',monospace;overscroll-behavior:none}
#root{min-height:100vh}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>

<script>
var R = "#e63030";
var FT = "'Courier New',monospace";

var LS = {
    get: function(e) {
        try {
            var t = localStorage.getItem(e);
            return t ? JSON.parse(t) : null;
        } catch (err) {
            return null;
        }
    }
};

var DEFAULT_PROG = {
    "Upper A": {
        label: "Üst Gövde A",
        day: "Pazartesi",
        exercises: [
            { id: "bench", name: "Barbell Bench Press", sets: 4, reps: "6-8", rir: "2-3" },
            { id: "row_a", name: "Barbell Row", sets: 4, reps: "6-8", rir: "2-3" },
            { id: "ohp", name: "Dumbbell Shoulder Press", sets: 3, reps: "8-10", rir: "2" }
        ]
    }
};

function App() {
    var useState = React.useState;
    var _h = React.createElement;

    var _b = useState(function() { return LS.get("fg3_prog") || DEFAULT_PROG; });
    var h = _b[0];
    var _y = useState("Upper A");
    var y = _y[0];

    var currentProg = h[y] || Object.values(h)[0] || { label: "Antrenman", day: "Gün", exercises: [] };
    var safeExercises = (currentProg && currentProg.exercises) ? currentProg.exercises : [];

    return _h("div", { style: { padding: 20, fontFamily: FT } },
        _h("h1", { style: { color: R } }, "FORGE APP"),
        _h("h2", null, currentProg.label + " (" + currentProg.day + ")"),
        _h("ul", { style: { marginTop: 15, paddingLeft: 20 } },
            safeExercises.map(function(ex, idx) {
                return _h("li", { key: ex.id || idx, style: { marginBottom: 8 } },
                    _h("b", null, ex.name), " - ", ex.sets, " x ", ex.reps, " (RIR: ", ex.rir, ")"
                );
            })
        )
    );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
