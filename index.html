<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#eef1f7"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="FORGE"/>
<title>FORGE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#eef1f7;color:#1d2430;font-family:'Courier New',monospace;overscroll-behavior:none}
#root{min-height:100vh}
#loader{position:fixed;inset:0;background:#eef1f7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999}
.ld-t{color:#e63030;font-size:32px;font-weight:900;letter-spacing:5px;text-shadow:0 0 30px #e6303066}
.ld-sub{color:#8a93a6;font-size:9px;letter-spacing:2px;text-transform:uppercase}
.ld-bar{width:160px;height:3px;background:#e3e8f0;border-radius:2px;overflow:hidden}
.ld-fill{height:100%;background:linear-gradient(90deg,#e63030,#ff6b35);border-radius:2px;width:0;transition:width 0.4s}
.ld-err{display:none;text-align:center;padding:20px;max-width:300px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#8a93a6;border-radius:2px}
input,select,textarea{background:#f2f4f9;border:1px solid #cbd2de;color:#1d2430;font-family:'Courier New',monospace;border-radius:5px}
input:focus,select:focus,textarea:focus{outline:none;border-color:#e63030;box-shadow:0 0 0 2px rgba(230,48,48,.15)}
input::placeholder,textarea::placeholder{color:#9aa3b3}
select option{background:#f2f4f9;color:#1d2430}
button{-webkit-tap-highlight-color:transparent}
button:active{opacity:.8}
@keyframes b0{0%,80%,100%{transform:scale(0)}40%{transform:scale(1.2)}}
@keyframes b1{0%,80%,100%{transform:scale(0)}40%{transform:scale(1.2)}}
@keyframes b2{0%,80%,100%{transform:scale(0)}40%{transform:scale(1.2)}}
</style>
</head>
<body>
<div id="root">
  <div id="loader">
    <div class="ld-t">FORGE</div>
    <div class="ld-bar"><div class="ld-fill" id="ldFill"></div></div>
    <div class="ld-sub" id="ldStatus">Başlatılıyor...</div>
    <div class="ld-err" id="ldErr">
      <div style="color:#e63030;font-size:11px;margin-bottom:8px">⚠️ Bağlantı sorunu</div>
      <div style="color:#6b7280;font-size:9px;line-height:1.8">Kütüphane yüklenemedi.<br>İnternet bağlantınızı kontrol edin.</div>
      <button onclick="location.reload()" style="margin-top:12px;padding:8px 20px;background:#e63030;border:none;color:#fff;border-radius:5px;font-family:monospace;cursor:pointer;font-size:10px">🔄 Tekrar Dene</button>
    </div>
  </div>
</div>
