<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#e63030"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="FORGE"/>
<title>FORGE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#070707;color:#e0e0e0;font-family:'Courier New',monospace;overscroll-behavior:none}
#root{min-height:100vh}
#loader{position:fixed;inset:0;background:#070707;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999}
.ld-t{color:#e63030;font-size:32px;font-weight:900;letter-spacing:5px;text-shadow:0 0 30px #e6303066}
.ld-sub{color:#333;font-size:9px;letter-spacing:2px;text-transform:uppercase}
.ld-bar{width:160px;height:3px;background:#111;border-radius:2px;overflow:hidden}
.ld-fill{height:100%;background:linear-gradient(90deg,#e63030,#ff6b35);border-radius:2px;width:0;transition:width 0.3s}
.ld-err{display:none;text-align:center;padding:20px;max-width:300px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
input,select,textarea{background:#1e1e1e;border:1px solid #3a3a3a;color:#f5f5f5;font-family:'Courier New',monospace;border-radius:5px}
input:focus,select:focus,textarea:focus{outline:none;border-color:#e63030;box-shadow:0 0 0 2px rgba(230,48,48,.15)}
input::placeholder,textarea::placeholder{color:#444}
select option{background:#1e1e1e;color:#f5f5f5}
button{-webkit-tap-highlight-color:transparent}
button:active{opacity:.8}
@keyframes b0{0%,80%,100%{transform:scale(0)}40%{transform:scale(1.2)}}
@keyframes b1{0%,80%,100%{transform:scale(0)}40%{transform:scale(1.2)}}
@keyframes b2{0%,80%,100%{transform:scale(0)}40%{transform:scale(1.2)}}
</style>
</head>
<body>
<div id="root">
  <div id="loader">
    <div class="ld-t">FORGE</div>
    <div class="ld-bar"><div class="ld-fill" id="ldFill"></div></div>
    <div class="ld-sub" id="ldStatus">Başlatılıyor...</div>
    <div class="ld-err" id="ldErr">
      <div style="color:#e63030;font-size:11px;margin-bottom:8px">⚠️ Bağlantı sorunu</div>
      <div style="color:#555;font-size:9px;line-height:1.8">Kütüphane yüklenemedi.<br>Lütfen internet bağlantınızı kontrol edin.</div>
      <button onclick="location.reload()" style="margin-top:12px;padding:8px 20px;background:#e63030;border:none;color:#fff;border-radius:5px;font-family:monospace;cursor:pointer;font-size:10px">🔄 Tekrar Dene</button>
    </div>
  </div>
</div>
<script>
(function(){
  var fill=document.getElementById('ldFill');
  var stat=document.getElementById('ldStatus');
  var err=document.getElementById('ldErr');
  var bar=document.querySelector('.ld-bar');

  function setProgress(pct,msg){
    fill.style.width=pct+'%';
    stat.textContent=msg;
  }

  function showError(){
    err.style.display='block';
    bar.style.display='none';
    stat.style.display='none';
  }

  // Timeout ile script yükleyici — 12 saniye timeout
  function loadWithTimeout(urls,idx,onOk,onFail,timeout){
    if(idx>=urls.length){onFail();return;}
    var done=false;
    var s=document.createElement('script');
    var t=setTimeout(function(){
      if(done)return;done=true;
      s.onload=s.onerror=null;
      console.warn('Timeout:',urls[idx]);
      loadWithTimeout(urls,idx+1,onOk,onFail,timeout);
    },timeout||15000);
    s.onload=function(){if(done)return;done=true;clearTimeout(t);onOk();};
    s.onerror=function(){if(done)return;done=true;clearTimeout(t);loadWithTimeout(urls,idx+1,onOk,onFail,timeout);};
    s.src=urls[idx];
    document.head.appendChild(s);
  }

  var libs=[
    {name:'React (1/4)',urls:['https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js','https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js','https://unpkg.com/react@18.2.0/umd/react.production.min.js']},
    {name:'ReactDOM (2/4)',urls:['https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js','https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js','https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js']},
    {name:'PropTypes (3/4)',urls:['https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js','https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js']},
    {name:'Recharts (4/4)',urls:['https://cdn.jsdelivr.net/npm/recharts@2.10.4/umd/Recharts.js','https://cdnjs.cloudflare.com/ajax/libs/recharts/2.10.4/Recharts.js','https://unpkg.com/recharts@2.10.4/umd/Recharts.js']}
  ];

  var progSteps=[10,35,65,85];

  function loadNext(i){
    if(i>=libs.length){
      setProgress(95,'Uygulama başlatılıyor...');
      setTimeout(function(){
        try{
          eval(window.__APP__);
          setTimeout(function(){
            var loader=document.getElementById('loader');
            if(loader)loader.style.display='none';
          },200);
        }catch(e){
          console.error(e);
          stat.textContent='Hata: '+e.message;
        }
      },50);
      return;
    }
    setProgress(progSteps[i],libs[i].name+' yükleniyor...');
    loadWithTimeout(libs[i].urls,0,function(){loadNext(i+1);},showError,20000);
  }

  loadNext(0);
})();
</script>

22 | Omuz: 12-18\\n  Biceps: 10-14 | Triceps: 10-14 | Bacak: 14-20\\nMAKSİMUM TOLERE EDİLEBİLİR (MRV) — aşınca toparlanamaz:\\n  Göğüs: 22+ | Sırt: 25+ | Bacak: 30+\\nHAFTALIK ARTIRMA: Her haftada +2 set ekle → MRV\'ye gelince deload.\\nFREKANS: Kas grubu başına haftada 2x — araştırmalar 1x\'ten %40 daha etkili (Schoenfeld 2016).\\n\\n━━━ 4. RIR/RPE SİSTEMİ (Zourdos 2016) ━━━\\nRIR (Reps In Reserve) = Bitirmeden önce kaç tekrar yapabilirdin?\\n  RIR 4-5: Çok kolay, büyüme uyarısı yok → vakit kaybı\\n  RIR 2-3: Compound hareketler için ideal — yeterli uyarı, form korunur\\n  RIR 1: Orta ağırlık izolasyon hareketleri\\n  RIR 0: Gerçek kas başarısızlığı — yalnızca izolasyonda, haftada max 1-2x\\nUYARI: Compound\'da başarısızlığa gitmek yaralanma riski + toparlanma maliyeti yüksek.\\n\\n━━━ 5. KAS GRUBU ÖZEL ANALİZ PROTOKOLÜ ━━━\\nGÖĞÜS (Pectoralis Major):\\n  - Zayıf nokta tespiti: Bench\'te alt veya üst göğüs eksikse incline/decline oranını ayarla\\n  - Alt göğüs zayıfsa: Decline bench veya high-to-low cable fly ekle\\n  - Üst göğüs zayıfsa: İncline bench ağırlığı flat bench\'in %80\'i olmalı\\n  - Göğüs/triceps oranı: Bench\'te triceps yoruluyorsa önce göğüs izolasyonu yap\\n  - İdeal frekans: Haftada 2x (Üst A + Üst B)\\n\\nSIRTI (Latissimus, Rhomboids, Trapezius):\\n  - Sırt en büyük kas grubu → en fazla set kaldırır (14-22/hafta)\\n  - Dikey çekiş (lat pulldown/pull-up) + yatay çekiş (row) dengesi kritik\\n  - Lat zayıfsa: Pulldown\'da tam germe + 1-2 sn hold ekle\\n  - Rhomboid zayıfsa: Face pull + rear delt fly artır\\n  - Deadlift günü sırt hacmine sayılır — dikkat, MRV\'yi aşabilir\\n\\nOMUZ (Deltoid — 3 kafa):\\n  - Ön delt: Bench press zaten çalışıyor, fazla izolasyon gereksiz\\n  - Yan delt (kritik): Omuz genişliği için lateral raise — haftada 12-18 set\\n  - Arka delt: Face pull + rear delt fly — sıklıkla ihmal edilir\\n  - OHP ile ön delt yüklenir; lateral raise ile yan delt; face pull ile arka delt\\n  - Omuz yaralanma riski: İmpingement — lateral raise\'de thumb-up tutuş önler\\n\\nBİCEPS:\\n  - Tam uzanma kritik (Preacher curl değil, incline curl daha iyi uzama sağlar)\\n  - Supinasyon (avuç yukarı çevirme) biceps aktivasyonunu %20 artırır\\n  - Kısa kafa vs uzun kafa: Incline curl uzun kafayı, preacher kısa kafayı çalışır\\n\\nTRİCEPS (%65 kol hacmi):\\n  - Uzun kafa (en büyük): Overhead extension ile tam uzama kritik\\n  - Lateral kafa: Pushdown — sık kullanılır ama tek başına yetmez\\n  - Medial kafa: Close grip bench ile aktive olur\\n  - Triceps büyümesi için overhead extension zorunlu (Stanek 2017)\\n\\nQUADRICEPS:\\n  - Squat derinliği: Paralelin altı %25 daha fazla quad aktivasyonu\\n  - VMO (iç quad): Leg extension + narrow stance squat ile özel çalışır\\n  - Squat vs Leg Press: Squat daha fazla testosterone yanıtı tetikler\\n  - BSS (Bulgarian): Tek bacak stabilitesi + derin stretch → etkili ama CNS yorucu\\n\\nHAMSTRİNG:\\n  - İki fonksiyon: Diz fleksiyonu (leg curl) + kalça ekstansiyonu (RDL)\\n  - Her ikisi de çalışılmalı — sadece RDL veya sadece curl yetmez\\n  - Nordic curl: Hamstring yaralanmasını %50 azaltır (Petersen 2011) — zorlu ama değerli\\n  - RDL\'de tam uzama: Hamstring stretch hissedilmeli\\n\\nBALDIRIN (Gastrocnemius + Soleus):\\n  - Gastrocnemius: Diz gergin (standing calf raise) — hızlı kasılan fiber\\n  - Soleus: Diz bükük (seated calf raise) — yavaş kasılan fiber, daha fazla set kaldırır\\n  - Her ikisi ayrı ayrı çalışılmalı\\n  - Baldır dirençli kaslar → yüksek tekrar (15-25), tam hareket açısı, tam uzama\\n\\nCORE:\\n  - Anti-rotasyon (Pallof press) + fleksiyon (crunch) + lateral fleksiyon (side bend) dengesi\\n  - Core stabilitesi compound harekette performansı belirler\\n  - Günde 3-4 set yeterli — aşırı hacim bele zarar verir\\n\\n━━━ 6. VÜCUT KOMPOZİSYONU ANALİZİ ━━━\\nFFMI (Fat-Free Mass Index) = Yağsız kütle / Boy²  + 6.1×(1.8 - Boy)\\n  FFMI < 18: Başlangıç seviyesi\\n  FFMI 18-20: Orta düzey — tipik fitness kullanıcısı\\n  FFMI 20-22: İyi seviye — tutarlı antrenman geçmişi\\n  FFMI 22-23: Elit naturel — uzun yıllar yoğun antrenman\\n  FFMI 23-25: Naturel sınır (erkek, genetik üst limit ~25)\\n  FFMI 25+: Doping şüphesi\\n\\nYAĞ ORANI DEĞERLENDİRME (erkek):\\n  %6-9: Yarışma kondisyonu — sürdürülemez\\n  %10-14: Atletik — visibte abs, yüksek testosteron\\n  %15-19: Fit — sağlıklı, kas geliştirme için ideal\\n  %20-24: Ortalama — bulk fazında kabul edilebilir\\n  %25+: Recomposisyon veya cut önerilen\\n\\nBEL ÇEVRESİ:\\n  <80cm: Optimal metabolik sağlık\\n  80-94cm: Dikkat — karın yağı artmaya başlıyor\\n  94cm+: Risk — insülin direnci, kortizol yüksekliği\\n\\nKAS ORANI HESABI: Yağsız kütle (kg) = Kilo × (1 - BF%/100)\\n\\n━━━ 7. BESLENME BİLİMİ ━━━\\n[Morton et al. 2018 — Br J Sports Med meta-analiz, 49 çalışma]\\nPROTEİN:\\n  - Minimum: 1.6g/kg — hipertrofi için alt sınır\\n  - Optimal: 2.2g/kg — çoğu araştırmanın önerisi\\n  - Maksimum fayda: 3.1g/kg (aşırı kalori kısıtlamasında)\\n  - Öğün başına: 0.4g/kg × 4 öğün = günlük toplam\\n  - Yatmadan önce: 40g kazein → gece kas sentezi (Res et al. 2012)\\n\\nKARBONHİDRAT ZAMANLAMASI [Burke 2017]:\\n  - Antrenman 1-2 saat önce: 30-60g düşük GI karb (yulaf, pirinç)\\n  - Antrenman sonrası 30dk: 40-80g yüksek GI karb + 40g protein\\n  - Gece: Düşük karb, yüksek protein → gece yağ yakımı optimize\\n\\nKALORİ STRATEJİSİ:\\n  - Temiz bulk: +200-300 kcal fazla → yavaş kas, az yağ\\n  - Agresif bulk: +500 kcal → hızlı kas, yağlanma riski\\n  - Recomposisyon: Maintenance ±50 kcal → yavaş ama yağ artmaz\\n  - Cut: -300-500 kcal → kas kaybı riskini minimize için protein artır\\n\\n━━━ 8. TOPARLANMA & UYKU BİLİMİ ━━━\\n[Leproult & Van Cauter 2011 — JAMA]\\n[Dattilo et al. 2011 — Med Hypotheses]\\nUYKU & TESTOSTERON:\\n  - 5 gece 5 saat uyku: Testosteron %10-15 düşüş\\n  - 7-9 saat: Optimal hormon profili\\n  - Derin uyku (evre 3-4): Büyüme hormonu salınımının %70\'i bu evrede\\n  - Sabah antrenman: Testosteron ~%30 daha yüksek (sabah piki)\\n\\nTOPARLANMA GÖSTERGELERİ:\\n  Kötü toparlanma belirtileri: Enerji düşüklüğü, güç kaybı, motivasyon eksikliği, artan kalp hızı\\n  İyi toparlanma: Seanstan 24-48 saat sonra normal enerji\\n\\nKORTIZOL YÖNETİMİ:\\n  - Kronik stres → kortizol → protein katabolizması → kas kaybı\\n  - Antrenman süresi >75 dk: Kortizol baskın hale geçmeye başlar\\n  - Çözüm: Seans <60 dk tut, karbonhidrat ile kortizol baskıla\\n\\n━━━ 9. DELOAD PROTOKOLLERİ (Israetel 2019) ━━━\\nNE ZAMAN DELOAD:\\n  - 4-6 hafta yoğun antrenman sonrası (planlanmış)\\n  - Performans düşüşü, ağrı, motivasyon kaybı (reaktif)\\n  - Joint ağrısı, kronik yorgunluk (zorunlu)\\nNASIL DELOAD:\\n  Yöntem A (Hacim azalt): Setleri %50 düşür, ağırlık aynı\\n  Yöntem B (Yük azalt): Ağırlığı %20-40 düşür, set/tekrar aynı\\n  Yöntem C (Frekans azalt): Haftada 4 gün → 2 güne düşür\\n  Süre: 5-7 gün yeterli\\n\\n━━━ 10. SUPPLEMENT BİLİMİ ━━━\\n[Rawson & Volek 2003 | Smith et al. 2011 | Cannell et al. 2009]\\nKREATİN MONOHİDRAT:\\n  - Doz: 3-5g/gün (yükleme gereksiz)\\n  - Etki: Güç +%5-15, kas kütlesi +1-2kg (su + gerçek kas)\\n  - Ne zaman: Herhangi bir saatte — tutarlılık önemli\\n  - En iyi kanıta sahip supplement\\n\\nWHEY PROTEİN:\\n  - Kullanım: Yemekle protein hedefine ulaşılamıyorsa\\n  - Antrenman sonrası: Hızlı emilim avantajı\\n  - İzolat vs konsantrat: Laktoz intoleransında izolat\\n\\nOMEGA-3 (EPA+DHA):\\n  - Doz: 2-4g/gün EPA+DHA\\n  - Etki: Kas protein sentezi +%50 artış (Smith 2011), inflamasyon azalır\\n  - Gece yemekle alınmalı (yağda çözünür)\\n\\nD VİTAMİNİ:\\n  - Türkiye\'de %70-80 yetersizlik (özellikle kış)\\n  - Doz: 2000-4000 IU/gün\\n  - Testosteron, kas gücü, bağışıklık ile ilişkili\\n\\nMAGNEZYUM:\\n  - Doz: 300-400mg/gün (glysinat veya malat formu)\\n  - Uyku kalitesi, kas krampı, ATP üretimi\\n  - Yatmadan 1 saat önce ideal\\n\\n━━━ 11. ANTRENMAN PRENSİPLERİ (AĞIRSAĞLAM METODOLOJİSİ) ━━━\\nÜSTÜN/ALT GÖVDE SPLIT AVANTAJLARI:\\n  - Her kas grubunu haftada 2x çalışma → frekans faydası\\n  - Üst gün toparlanırken alt gün çalışır → verimli\\n  - 4 gün/
